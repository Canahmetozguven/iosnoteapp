name: iOS Build

on:
  workflow_dispatch:

jobs:
  preflight:
    name: Fast Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show revision
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          git log -1 --oneline

      - name: Run iOS preflight checks
        run: |
          bash scripts/ci/ios_preflight.sh

  build:
    name: Build iOS App
    runs-on: macos-15
    needs: preflight
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Show revision
      run: |
        echo "GITHUB_SHA=$GITHUB_SHA"
        git log -1 --oneline

    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Install Dependencies
      run: |
        brew install cmake xcodegen
        xcodebuild -version
        xcodebuild -showsdks || true

    - name: Validate iOS Build Configuration
      run: |
        grep -q '"scheme": "SynapsNotes-iOS"' eas.json
        grep -q '^name: SynapsNotes-iOS' ios/project.yml
        grep -q 'PRODUCT_BUNDLE_IDENTIFIER: com.synapsnotes.ios' ios/project.yml

    - name: Validate AppIcon asset catalog (no mutation)
      run: |
        set -euo pipefail
        ICON_DIR="ios/Resources/Assets.xcassets/AppIcon.appiconset"
        test -f "$ICON_DIR/Contents.json"
        python3 - <<'PY'
        import json
        import sys
        from pathlib import Path

        icon_dir = Path("ios/Resources/Assets.xcassets/AppIcon.appiconset")
        data = json.loads((icon_dir / "Contents.json").read_text(encoding="utf-8"))
        images = data.get("images", [])
        missing = []
        referenced = set()
        for img in images:
            filename = img.get("filename")
            if not filename:
                continue
            referenced.add(filename)
            if not (icon_dir / filename).is_file():
                missing.append(filename)

        if missing:
            print("Missing icon files referenced by AppIcon.appiconset/Contents.json:")
            for name in sorted(set(missing)):
                print(f"- {name}")
            sys.exit(1)

        required = {
            "Icon-60@2x.png",
            "Icon-60@3x.png",
            "Icon-76@2x.png",
            "Icon-ipad-76@1x.png",
            "Icon-1024.png",
        }
        not_referenced = sorted(required - referenced)
        if not_referenced:
            print("Required icon entries are missing from AppIcon.appiconset/Contents.json:")
            for name in not_referenced:
                print(f"- {name}")
            sys.exit(1)
        PY
        # App Store validation requires opaque marketing icon.
        sips -g hasAlpha "$ICON_DIR/Icon-1024.png" | grep -q "hasAlpha: no"
        
    - name: Build llama.cpp (AI Engine)
      run: |
        cd ios/llama
        chmod +x scripts/build-ios-xcframework.sh
        ./scripts/build-ios-xcframework.sh
        ls -R build-apple/llama.xcframework

    - name: Move Llama Framework
      run: |
        mkdir -p ios/Frameworks
        cp -R ios/llama/build-apple/llama.xcframework ios/Frameworks/

    - name: Generate Project with xcodegen
      run: |
        cd ios
        xcodegen
        PBXPROJ="SynapsNotes-iOS.xcodeproj/project.pbxproj"
        sed -i '' 's/objectVersion = 77;/objectVersion = 60;/g' "$PBXPROJ"
        sed -i '' '/minimizedProjectReferenceProxies = 1;/d' "$PBXPROJ"
        sed -i '' '/preferredProjectObjectVersion = 56;/d' "$PBXPROJ"
        grep -n "objectVersion" "$PBXPROJ" | head -1
        xcodebuild -list -project SynapsNotes-iOS.xcodeproj

    - name: Build iOS App
      run: |
        cd ios
        
        xcodebuild -project SynapsNotes-iOS.xcodeproj \
                   -scheme SynapsNotes-iOS \
                   -sdk iphoneos \
                   -configuration Release \
                   -derivedDataPath build \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO

    - name: Upload .app Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SynapsNotes-iOS-App
        path: ios/build/Build/Products/Release-iphoneos/SynapsNotes-iOS.app
