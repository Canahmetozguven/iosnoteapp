name: iOS TestFlight (GitHub)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Fast Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show revision
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          git log -1 --oneline

      - name: Validate required secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT_BASE64: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for var in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT_BASE64 IOS_DIST_P12_BASE64 IOS_DIST_P12_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!var}" ]; then
              echo "Missing GitHub secret: $var"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Run iOS preflight checks
        run: |
          bash scripts/ci/ios_preflight.sh

  release:
    name: Build and Upload TestFlight
    runs-on: macos-15
    needs: preflight
    timeout-minutes: 90
    env:
      FASTLANE_SKIP_UPDATE_CHECK: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show revision
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          git log -1 --oneline

      - name: Select Xcode (iOS 18+ SDK today; iOS 26+ SDK required starting 2026-04-28)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Validate required secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT_BASE64: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for var in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT_BASE64 IOS_DIST_P12_BASE64 IOS_DIST_P12_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!var}" ]; then
              echo "Missing GitHub secret: $var"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup Ruby and Bundler cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install build dependencies
        run: |
          brew install cmake xcodegen
          xcodebuild -version
          xcodebuild -showsdks || true
          xcodegen --version

      - name: Validate required resources (icons + launch screen)
        run: |
          set -euo pipefail
          test -f ios/Resources/Info.plist
          test -f ios/Resources/PrivacyInfo.xcprivacy
          test -f ios/Resources/LaunchScreen.storyboard
          test -f ios/Resources/Assets.xcassets/AppIcon.appiconset/Icon-60@2x.png
          test -f ios/Resources/Assets.xcassets/AppIcon.appiconset/Icon-76@2x.png
          test -f ios/Resources/Assets.xcassets/AppIcon.appiconset/Icon-1024.png
          test -f ios/Resources/Assets.xcassets/AppIcon.appiconset/Icon-ipad-76@1x.png
          sips -g hasAlpha ios/Resources/Assets.xcassets/AppIcon.appiconset/Icon-1024.png | grep -q "hasAlpha: no"
          ls -la ios/Resources/Assets.xcassets/AppIcon.appiconset
          echo "Resources present."

      - name: Build llama.cpp XCFramework
        run: |
          cd ios/llama
          chmod +x scripts/build-ios-xcframework.sh
          ./scripts/build-ios-xcframework.sh
          ls -R build-apple/llama.xcframework

      - name: Move llama XCFramework
        run: |
          mkdir -p ios/Frameworks
          rm -rf ios/Frameworks/llama.xcframework
          cp -R ios/llama/build-apple/llama.xcframework ios/Frameworks/

      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen
          xcodebuild -list -project SynapsNotes-iOS.xcodeproj

      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@v5
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_P12_PASSWORD }}

      - name: Validate signing identities (cred check)
        run: |
          security find-identity -v -p codesigning || true

      - name: Decode App Store Connect private key
        id: decode_key
        env:
          ASC_KEY_CONTENT_BASE64: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os

          decoded = base64.b64decode(os.environ["ASC_KEY_CONTENT_BASE64"]).decode("utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("api_private_key<<EOF\n")
              out.write(decoded)
              if not decoded.endswith("\n"):
                  out.write("\n")
              out.write("EOF\n")
          PY

      - name: Download provisioning profile from App Store Connect
        id: provisioning
        uses: apple-actions/download-provisioning-profiles@v4
        with:
          bundle-id: com.synapsnotes.ios
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ steps.decode_key.outputs.api_private_key }}

      - name: Resolve provisioning profile name
        id: resolve_profile
        env:
          PROFILES_JSON: ${{ steps.provisioning.outputs.profiles }}
        run: |
          PROFILE_NAME=$(python3 - <<'PY'
          import json, os
          profiles = json.loads(os.environ["PROFILES_JSON"])
          if not profiles:
              raise SystemExit("No provisioning profiles downloaded")
          print(profiles[0]["name"])
          PY
          )
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "Using provisioning profile: $PROFILE_NAME"

      - name: Build IPA (fastlane)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
          APP_IDENTIFIER: com.synapsnotes.ios
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ steps.resolve_profile.outputs.profile_name }}
          MARKETING_VERSION: 1.0.0
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          bundle exec fastlane ios github_build

      - name: Inspect IPA contents (must include icons + launch screen)
        if: always()
        run: |
          set -euo pipefail
          IPA="build/SynapsNotes-iOS.ipa"
          if [ ! -f "$IPA" ]; then
            echo "Missing $IPA"
            exit 1
          fi
          rm -rf /tmp/ipa_inspect
          mkdir -p /tmp/ipa_inspect
          unzip -q "$IPA" -d /tmp/ipa_inspect
          APP_PATH=$(find /tmp/ipa_inspect/Payload -maxdepth 2 -name "*.app" -print -quit)
          echo "APP_PATH=$APP_PATH"
          ls -la "$APP_PATH" | head -50
          echo "---- Info.plist keys ----"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :UILaunchStoryboardName" "$APP_PATH/Info.plist" || true
          echo "---- Look for Assets.car / LaunchScreen ----"
          find "$APP_PATH" -maxdepth 2 -name "Assets.car" -o -name "LaunchScreen.storyboardc" -o -name "*.png" | head -50 || true
          test -f "$APP_PATH/Assets.car"

      - name: Upload to TestFlight (fastlane)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
          APP_IDENTIFIER: com.synapsnotes.ios
        run: |
          bundle exec fastlane ios github_upload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SynapsNotes-iOS-ipa
          path: build/SynapsNotes-iOS.ipa
          if-no-files-found: error
