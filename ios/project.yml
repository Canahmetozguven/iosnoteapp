name: SynapsNotes-iOS
options:
  bundleIdPrefix: com.synapsnotes
  xcodeVersion: "16.0"
  deploymentTarget:
    iOS: 17.0

schemes:
  SynapsNotes-iOS:
    shared: true
    build:
      targets:
        SynapsNotes: all
        SynapsNotesTests: [test]
    test:
      gatherCoverageData: false
      targets:
        - name: SynapsNotesTests

targets:
  SynapsNotes:
    type: application
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: App
        type: group
        createIntermediateGroups: true
      - path: Core
        type: group
        createIntermediateGroups: true
      - path: Data
        type: group
        createIntermediateGroups: true
      - path: Domain
        type: group
        createIntermediateGroups: true
      - path: UI
        type: group
        createIntermediateGroups: true
    dependencies:
      - framework: Frameworks/llama.xcframework
        embed: true
    resources:
      - path: Resources
        type: group
        createIntermediateGroups: true
    settings:
      PRODUCT_NAME: SynapsNotes-iOS
      PRODUCT_BUNDLE_IDENTIFIER: com.synapsnotes.ios
      SWIFT_VERSION: 5.10
      SUPPORTED_PLATFORMS: iphoneos iphonesimulator
      INFOPLIST_FILE: Resources/Info.plist
      GENERATE_INFOPLIST_FILE: NO
      MARKETING_VERSION: 1.0.0
      CURRENT_PROJECT_VERSION: 1
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SynapsNotesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: Tests
        type: group
        createIntermediateGroups: true
    dependencies:
      - target: SynapsNotes
    settings:
      PRODUCT_NAME: SynapsNotesTests
      SWIFT_VERSION: 5.10
      SUPPORTED_PLATFORMS: iphoneos iphonesimulator
