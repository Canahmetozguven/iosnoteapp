name: SynapsNotes-iOS
options:
  bundleIdPrefix: com.synapsnotes
  xcodeVersion: "16.0"
  deploymentTarget:
    iOS: 17.0

schemes:
  SynapsNotes-iOS:
    shared: true
    build:
      targets:
        SynapsNotes: all
        SynapsNotesTests: [test]
    test:
      gatherCoverageData: false
      targets:
        - name: SynapsNotesTests

targets:
  SynapsNotes:
    type: application
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: App
        type: group
        createIntermediateGroups: true
      - path: Core
        type: group
        createIntermediateGroups: true
      - path: Data
        type: group
        createIntermediateGroups: true
      - path: Domain
        type: group
        createIntermediateGroups: true
      - path: UI
        type: group
        createIntermediateGroups: true
      # Force these into the resources build phase (Xcode must generate `Assets.car` and `LaunchScreen.storyboardc`).
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/LaunchScreen.storyboard
        buildPhase: resources
    dependencies:
      - framework: Frameworks/llama.xcframework
        embed: true
    settings:
      base:
        PRODUCT_NAME: SynapsNotes-iOS
        PRODUCT_BUNDLE_IDENTIFIER: com.synapsnotes.ios
        SWIFT_VERSION: 5.10
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES

  SynapsNotesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: Tests
        type: group
        createIntermediateGroups: true
    dependencies:
      - target: SynapsNotes
    settings:
      base:
        PRODUCT_NAME: SynapsNotesTests
        SWIFT_VERSION: 5.10
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
