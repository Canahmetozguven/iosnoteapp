<!DOCTYPE html>
<html>
<head>
<style>
    body { 
        margin: 0; 
        padding: 0; 
        width: 1024px; 
        height: 500px; 
        background: linear-gradient(135deg, #4A3A7D 0%, #6650A5 100%);
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: white;
        overflow: hidden;
        display: flex;
        align-items: center;
        position: relative;
    }
    
    .content {
        padding-left: 60px;
        z-index: 2;
        width: 500px;
    }

    .logo-container {
        width: 80px;
        height: 80px;
        margin-bottom: 20px;
    }

    h1 {
        font-size: 56px;
        margin: 0;
        font-weight: 800;
        letter-spacing: -1px;
    }

    p {
        font-size: 24px;
        margin: 10px 0 0 0;
        opacity: 0.9;
        font-weight: 400;
    }

    .badge {
        display: inline-block;
        margin-top: 30px;
        padding: 8px 16px;
        background: rgba(255,255,255,0.15);
        border-radius: 20px;
        font-size: 14px;
        font-weight: 600;
        border: 1px solid rgba(255,255,255,0.3);
    }

    .mockup-container {
        position: absolute;
        right: -50px;
        top: 40px;
        transform: rotate(-10deg);
        z-index: 1;
        box-shadow: -20px 20px 50px rgba(0,0,0,0.4);
        border-radius: 30px;
        overflow: hidden;
        border: 8px solid #222;
        width: 320px;
        height: 640px;
    }

    .mockup-img {
        width: 100%;
        height: auto;
    }

    /* Abstract background decoration */
    .decoration {
        position: absolute;
        top: -100px;
        right: -100px;
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
        z-index: 0;
    }

</style>
</head>
<body>

<div class="decoration"></div>

<div class="content">
    <div class="logo-container">
        <svg viewBox="0 0 108 108" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M54 54 L54 28 M54 54 L30 74 M54 54 L78 74" 
                  stroke="white" stroke-width="6" stroke-linecap="round"/>
            <circle cx="54" cy="54" r="12" fill="white"/>
            <circle cx="54" cy="22" r="6" fill="white"/>
            <circle cx="26" cy="78" r="6" fill="white"/>
            <circle cx="82" cy="78" r="6" fill="white"/>
        </svg>
    </div>
    <h1>Synapse Notes</h1>
    <p>Private On-Device AI Intelligence</p>
    <div class="badge">100% OFFLINE AI • PRIVACY FIRST</div>
</div>

<div class="mockup-container">
    <img src="screen_chat.png" class="mockup-img">
</div>

</body>
</html>
