<!DOCTYPE html>
<html>
<head>
<style>
    body { 
        margin: 0; 
        padding: 0; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        background: transparent;
        height: 512px;
        width: 512px;
    }
    
    .logo-container {
        position: relative;
        width: 480px; /* Much bigger */
        height: 480px;
        display: flex;
        justify-content: center;
        align-items: center;
        filter: drop-shadow(0 0 25px rgba(99, 102, 241, 0.5));
    }

    /* The "Note" Shape - Now subtle but visible on any bg */
    .note-shape {
        position: absolute;
        width: 340px;
        height: 400px;
        background: linear-gradient(160deg, rgba(99, 102, 241, 0.2), rgba(192, 132, 252, 0.1));
        border-radius: 60px;
        border: 4px solid rgba(255,255,255,0.3);
        backdrop-filter: blur(5px);
        transform: rotate(-5deg);
    }

    /* The "Brain/Synapse" Shape - Main Icon */
    .synapse-shape {
        position: absolute;
        width: 280px;
        height: 280px;
        z-index: 2;
    }

    /* Glowing Dots/Nodes */
    .node {
        position: absolute;
        border-radius: 50%;
        background: #A5B4FC;
        box-shadow: 0 0 20px #818CF8;
    }
    .n1 { width: 28px; height: 28px; top: 10%; right: 10%; }
    .n2 { width: 18px; height: 18px; bottom: 15%; left: 8%; opacity: 0.8; }
    .n3 { width: 22px; height: 22px; top: 25%; left: 4%; opacity: 0.7; }
    
</style>
</head>
<body>

<div class="logo-container">
    <!-- Subdued Note Card -->
    <div class="note-shape"></div>
    
    <!-- Central Synapse -->
    <svg class="synapse-shape" viewBox="0 0 100 100" fill="none">
        <defs>
            <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#818CF8;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#C084FC;stop-opacity:1" />
            </linearGradient>
            <filter id="glow">
                <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                <feMerge>
                    <feMergeNode in="coloredBlur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
        </defs>
        
        <!-- Central Brain Circuit Icon -->
        <path d="M50 20 C30 20, 20 40, 20 50 C20 70, 35 80, 50 80 C65 80, 80 70, 80 50 C80 30, 70 20, 50 20 Z M50 35 C60 35, 65 45, 65 50 C65 55, 60 65, 50 65 C40 65, 35 55, 35 50 C35 45, 40 35, 50 35 Z" 
              fill="url(#grad1)" filter="url(#glow)"/>
        
        <!-- Circuit Lines -->
        <path d="M50 20 L50 8" stroke="url(#grad1)" stroke-width="4" stroke-linecap="round"/>
        <path d="M80 50 L92 50" stroke="url(#grad1)" stroke-width="4" stroke-linecap="round"/>
        <path d="M20 50 L8 50" stroke="url(#grad1)" stroke-width="4" stroke-linecap="round"/>
        <path d="M50 80 L50 92" stroke="url(#grad1)" stroke-width="4" stroke-linecap="round"/>
    </svg>
    
    <div class="node n1"></div>
    <div class="node n2"></div>
    <div class="node n3"></div>
</div>

</body>
</html>
